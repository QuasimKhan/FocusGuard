name: Build & Publish Production APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish (for example v1.4.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify tag and Gradle version
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tags must use the vMAJOR.MINOR.PATCH format (for example v1.5.0)."
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          IFS='.' read -r major minor patch <<< "$version"
          expected_code=$((major * 10000 + minor * 100 + patch))
          gradle_name=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          gradle_code=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)

          if [[ "$gradle_name" != "$version" ]]; then
            echo "Tag $RELEASE_TAG does not match Gradle versionName $gradle_name."
            exit 1
          fi
          if [[ "$gradle_code" != "$expected_code" ]]; then
            echo "Gradle versionCode $gradle_code does not match expected code $expected_code."
            exit 1
          fi

      - name: Decode and verify release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Required GitHub Actions secret $secret_name is not configured."
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/focusguard-release.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/focusguard-release.jks" \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" > /dev/null

      - name: Run unit tests and build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/focusguard-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Prepare named APK artifact
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          cp "$apk" "FocusGuard-${RELEASE_TAG}-Quasim.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "FocusGuard ${{ env.RELEASE_TAG }}"
          body: |
            FocusGuard ${{ env.RELEASE_TAG }} production APK.

            This signed APK can be installed over an existing FocusGuard installation. The asset name matches the in-app update checker.
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: "FocusGuard-${{ env.RELEASE_TAG }}-Quasim.apk"
